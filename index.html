<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <link rel="stylesheet" href="style.css">
    <script src="metronome.js" defer></script>
</head>

<body>
    <div class="app">
        <h1>Metronome</h1>
        <h2>BPM: <span id="bpm">100</span></h2>
        <div class="slider-container">
            <input type="range" min="30" max="300" value="100" class="slider" id="slider">
        </div>
        <div class="change-bpm">
            <button type="button" class="btn-primary" id="decrease-five-bpm">--</button>
            <button type="button" class="btn-primary" id="decrease-bpm">-</button>
            <button type="button" class="btn-primary" id="increase-bpm">+</button>
            <button type="button" class="btn-primary" id="increase-five-bpm">++</button>
        </div>
        <div class="beats" id="beats">
            <div class="beat beat--accent"></div>
            <div class="beat"></div>
            <div class="beat"></div>
            <div class="beat"></div>
        </div>
        <div class="start-stop">
            <button type="button" class="btn-primary" id="btn-start">Start</button>
            <button type="button" class="btn-primary" id="btn-stop">Stop</button>
        </div>
    </div>
</body>

</html>
