<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="metronome.js" defer></script>
</head>

<body>
    <header>
        <div class="header-bar">
            <img class="logo" src="img/logo-white.png" alt="Ssyc">
            <button type="button" class="settings-btn" id="btn-settings" aria-label="Open settings">
                <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M14.59 2.59c-.32-.2-.74-.18-1.04.05l-1.44 1.1c-.22.17-.52.22-.78.13l-1.74-.63c-.36-.13-.77-.02-1.02.26L7.2 4.88c-.28.28-.38.69-.25 1.05l.63 1.73c.09.26.04.56-.13.78l-1.11 1.44c-.23.3-.24.72-.04 1.04l1.11 1.66c.16.24.2.54.11.81l-.57 1.78c-.12.37-.01.77.27 1.05l1.37 1.37c.28.28.69.38 1.05.26l1.74-.57c.27-.09.57-.05.8.12l1.66 1.1c.32.21.74.19 1.04-.05l1.44-1.1c.22-.16.51-.21.77-.12l1.74.57c.37.12.78.02 1.05-.26l1.37-1.37c.28-.28.39-.68.27-1.05l-.57-1.78c-.09-.27-.05-.57.11-.81l1.11-1.66c.2-.32.19-.74-.04-1.04l-1.11-1.44c-.17-.22-.22-.52-.13-.78l.63-1.73c.13-.36.03-.77-.25-1.05L20.43 3.5c-.25-.28-.66-.39-1.02-.26l-1.74.63c-.26.09-.56.04-.78-.13l-1.44-1.1ZM12 9.1c1.6 0 2.9 1.3 2.9 2.9 0 1.6-1.3 2.9-2.9 2.9-1.6 0-2.9-1.3-2.9-2.9 0-1.6 1.3-2.9 2.9-2.9Z" />
                </svg>
            </button>
        </div>
    </header>
    <div class="app">
        <section class="top">
            <button type="button" class="tap" id="tap">TAP</button>
            <div class="bpm-circle">
                <p>BPM</p>
                <h2 id="bpm">100</h2>
                <!-- TODO: Add tempo text functionality based on bpm -->
                <p class="tempo">Allegretto</p>
            </div>
            <div class="time-signature">
                <div class="numerator">
                    <button type="button" class="btn-primary" id="decrease-numerator">-</button>
                    <h2 id="numerator">4</h2>
                    <button type="button" class="btn-primary" id="increase-numerator">+</button>
                </div>
                <div class="denominator">
                    <button type="button" class="btn-primary" id="decrease-denominator">-</button>
                    <h2 id="denominator">4</h2>
                    <button type="button" class="btn-primary" id="increase-denominator">+</button>
                </div>
            </div>
        </section>

        <section class="beats-section">
            <div class="beats" id="beats">
                <div class="beat"></div>
                <div class="beat"></div>
                <div class="beat"></div>
                <div class="beat"></div>
            </div>
        </section>

        <section class="tempo-section">
            <button type="button" class="btn-primary" id="decrease-five-bpm">--</button>
            <button type="button" class="btn-primary" id="decrease-bpm">-</button>
            <div class="slider-container">
                <input type="range" min="30" max="300" value="100" class="slider" id="slider">
            </div>
            <button type="button" class="btn-primary" id="increase-bpm">+</button>
            <button type="button" class="btn-primary" id="increase-five-bpm">++</button>
        </section>

        <div class="sound-dropdown">
            <label for="sound">Choose a metrnome sound:</label>
            <select name="sound" id="sound-dropdown">
                <option value="beat-1">Beat 1</option>
                <option value="beat-2">Beat 2</option>
            </select>
        </div>

        <div class="start-stop">
            <button type="button" class="btn-primary" id="btn-toggle-metronome" aria-pressed="false">Start</button>
        </div>
    </div>
</body>

</html>
